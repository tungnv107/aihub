# Merge with the existing server compose; preserves its DB, data and secrets.
services:
  sub2api:
    image: aihub-sub2api:production
    pull_policy: never
    ports: ["127.0.0.1:18080:8080"]
    environment:
      CH_RELAY_LICENSE_ONLY: "true"
      AIHUB_GATEWAY_SECRET: ${AIHUB_GATEWAY_SECRET:?required}
      SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP: "false"
      SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS: "false"
