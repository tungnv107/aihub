services:
  self-relay:
    build:
      context: ../..
      dockerfile: relay_product/deploy/Dockerfile
    restart: unless-stopped
    init: true
    user: "${TDH_UID:-1000}:${TDH_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: ../../proxy-data/secrets.env
    environment:
      RELAY_DB: /data/relay.sqlite
    volumes: ["../../proxy-data:/data", "/etc/machine-id:/run/tdh-machine-id:ro"]
    ports: ["127.0.0.1:18320:8320"]
    networks: [relay]
networks:
  relay:
    name: tdh-relay
